<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tasky — Smart To-Do List</title>
  <meta name="description" content="A premium, minimalist to-do list app with priorities, due dates, drag & drop, and local storage persistence." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- ═══════════════════════════════════════════════════════════
       STYLES
  ═══════════════════════════════════════════════════════════ -->
  <style>
    /* ─── CSS CUSTOM PROPERTIES ─────────────────────────── */
    :root {
      --font: 'Inter', sans-serif;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 28px;
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-bounce: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Dark theme (default) */
    [data-theme="dark"] {
      --bg-page:        #0d0f14;
      --bg-card:        rgba(255, 255, 255, 0.045);
      --bg-card-hover:  rgba(255, 255, 255, 0.075);
      --bg-input:       rgba(255, 255, 255, 0.06);
      --bg-input-focus: rgba(255, 255, 255, 0.1);
      --bg-overlay:     rgba(0, 0, 0, 0.6);
      --border:         rgba(255, 255, 255, 0.08);
      --border-focus:   rgba(139, 92, 246, 0.7);
      --text-primary:   #f0f0f5;
      --text-secondary: #8b8fa8;
      --text-muted:     #4a4d62;
      --accent:         #8b5cf6;
      --accent-glow:    rgba(139, 92, 246, 0.35);
      --accent-soft:    rgba(139, 92, 246, 0.15);
      --success:        #10b981;
      --success-soft:   rgba(16, 185, 129, 0.15);
      --danger:         #ef4444;
      --danger-soft:    rgba(239, 68, 68, 0.15);
      --warn:           #f59e0b;
      --warn-soft:      rgba(245, 158, 11, 0.15);
      --info:           #3b82f6;
      --info-soft:      rgba(59, 130, 246, 0.15);
      --shadow-card:    0 4px 24px rgba(0,0,0,0.4);
      --shadow-drop:    0 8px 40px rgba(0,0,0,0.6);
      --scrollbar-thumb: rgba(255,255,255,0.12);
      --scrollbar-track: transparent;
      --glass-blur:     12px;
    }

    /* Light theme */
    [data-theme="light"] {
      --bg-page:        #f0f2f8;
      --bg-card:        rgba(255, 255, 255, 0.75);
      --bg-card-hover:  rgba(255, 255, 255, 0.95);
      --bg-input:       rgba(255, 255, 255, 0.8);
      --bg-input-focus: #ffffff;
      --bg-overlay:     rgba(240, 242, 248, 0.6);
      --border:         rgba(0, 0, 0, 0.08);
      --border-focus:   rgba(139, 92, 246, 0.6);
      --text-primary:   #1a1b2e;
      --text-secondary: #5a5f7a;
      --text-muted:     #a8abbe;
      --accent:         #7c3aed;
      --accent-glow:    rgba(124, 58, 237, 0.25);
      --accent-soft:    rgba(124, 58, 237, 0.1);
      --success:        #059669;
      --success-soft:   rgba(5, 150, 105, 0.1);
      --danger:         #dc2626;
      --danger-soft:    rgba(220, 38, 38, 0.1);
      --warn:           #d97706;
      --warn-soft:      rgba(217, 119, 6, 0.1);
      --info:           #2563eb;
      --info-soft:      rgba(37, 99, 235, 0.1);
      --shadow-card:    0 4px 24px rgba(0,0,0,0.08);
      --shadow-drop:    0 8px 40px rgba(0,0,0,0.15);
      --scrollbar-thumb: rgba(0,0,0,0.15);
      --scrollbar-track: transparent;
      --glass-blur:     12px;
    }

    /* ─── RESET & BASE ───────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      font-family: var(--font);
      font-size: 16px;
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 60px;
      transition: background var(--transition), color var(--transition);
      overflow-x: hidden;
    }

    /* Animated background orbs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
      transition: opacity var(--transition);
    }
    body::before {
      width: 520px; height: 520px;
      background: radial-gradient(circle, rgba(139,92,246,0.18), transparent 70%);
      top: -100px; right: -100px;
    }
    body::after {
      width: 420px; height: 420px;
      background: radial-gradient(circle, rgba(59,130,246,0.12), transparent 70%);
      bottom: 0; left: -80px;
    }

    /* ─── SCROLLBAR ──────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
    ::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border-radius: 10px;
    }

    /* ─── LAYOUT ─────────────────────────────────────────── */
    .app-wrapper {
      width: 100%;
      max-width: 680px;
      position: relative;
      z-index: 1;
    }

    /* ─── HEADER ─────────────────────────────────────────── */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      padding-top: 8px;
    }

    .app-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 42px; height: 42px;
      background: linear-gradient(135deg, var(--accent), #3b82f6);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 4px 20px var(--accent-glow);
      flex-shrink: 0;
    }

    .brand-text h1 {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--text-primary) 60%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand-text p {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 1px;
      letter-spacing: 0.3px;
    }

    .header-actions { display: flex; gap: 8px; align-items: center; }

    /* Theme toggle */
    .theme-toggle {
      width: 38px; height: 38px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      backdrop-filter: blur(var(--glass-blur));
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 17px;
      display: flex; align-items: center; justify-content: center;
      transition: all var(--transition);
    }
    .theme-toggle:hover {
      background: var(--bg-card-hover);
      color: var(--accent);
      border-color: var(--accent-soft);
      transform: scale(1.05);
    }

    /* ─── STATS BAR ──────────────────────────────────────── */
    .stats-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-pill {
      flex: 1;
      background: var(--bg-card);
      backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      text-align: center;
      transition: all var(--transition);
      cursor: default;
    }
    .stat-pill:hover {
      background: var(--bg-card-hover);
      transform: translateY(-2px);
      box-shadow: var(--shadow-card);
    }

    .stat-number {
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1;
      display: block;
    }
    .stat-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-top: 4px;
      display: block;
    }

    .stat-pill.total   .stat-number { color: var(--text-primary); }
    .stat-pill.done    .stat-number { color: var(--success); }
    .stat-pill.pending .stat-number { color: var(--accent); }

    /* Progress bar */
    .progress-wrap {
      margin-bottom: 20px;
      background: var(--bg-card);
      backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 18px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .progress-title {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.3px;
    }

    .progress-percent {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--accent);
    }

    .progress-track {
      height: 6px;
      background: var(--bg-input);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--accent), #3b82f6);
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* ─── INPUT CARD ─────────────────────────────────────── */
    .input-card {
      background: var(--bg-card);
      backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-card);
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .task-input {
      flex: 1;
      background: var(--bg-input);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      font-family: var(--font);
      font-size: 0.95rem;
      color: var(--text-primary);
      outline: none;
      transition: all var(--transition);
    }
    .task-input::placeholder { color: var(--text-muted); }
    .task-input:focus {
      border-color: var(--border-focus);
      background: var(--bg-input-focus);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .add-btn {
      width: 46px; height: 46px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--accent), #3b82f6);
      border: none;
      border-radius: var(--radius-md);
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all var(--transition-bounce);
      box-shadow: 0 4px 16px var(--accent-glow);
    }
    .add-btn:hover { transform: scale(1.08) rotate(3deg); box-shadow: 0 6px 24px var(--accent-glow); }
    .add-btn:active { transform: scale(0.94); }

    /* Meta row (priority + due date) */
    .input-meta {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .meta-select, .meta-date {
      flex: 1;
      background: var(--bg-input);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 9px 12px;
      font-family: var(--font);
      font-size: 0.82rem;
      color: var(--text-primary);
      outline: none;
      cursor: pointer;
      transition: all var(--transition);
      appearance: none;
    }
    .meta-select:focus, .meta-date:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .meta-date::-webkit-calendar-picker-indicator {
      filter: var(--cal-filter, invert(0.5));
      cursor: pointer;
    }
    [data-theme="dark"] .meta-date::-webkit-calendar-picker-indicator { filter: invert(0.7); }

    /* ─── FILTER BAR ─────────────────────────────────────── */
    .filter-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 7px 16px;
      border-radius: 99px;
      border: 1.5px solid var(--border);
      background: var(--bg-card);
      backdrop-filter: blur(var(--glass-blur));
      color: var(--text-secondary);
      font-family: var(--font);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      letter-spacing: 0.2px;
    }
    .filter-btn:hover { color: var(--accent); border-color: var(--accent-soft); }
    .filter-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: var(--border-focus);
      font-weight: 600;
    }

    /* Sort & clear row */
    .action-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 8px;
    }

    .sort-select {
      background: var(--bg-input);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 7px 12px;
      font-family: var(--font);
      font-size: 0.78rem;
      color: var(--text-secondary);
      outline: none;
      cursor: pointer;
      transition: all var(--transition);
    }
    .sort-select:focus { border-color: var(--border-focus); }

    .clear-btn {
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--danger-soft);
      background: transparent;
      color: var(--danger);
      font-family: var(--font);
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: all var(--transition);
    }
    .clear-btn.visible { opacity: 1; pointer-events: auto; }
    .clear-btn:hover { background: var(--danger-soft); }

    /* ─── TASK LIST ──────────────────────────────────────── */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 60px;
    }

    /* ─── TASK ITEM ──────────────────────────────────────── */
    .task-item {
      background: var(--bg-card);
      backdrop-filter: blur(var(--glass-blur));
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: all var(--transition);
      box-shadow: var(--shadow-card);
      cursor: grab;
      position: relative;
      overflow: hidden;
    }
    .task-item::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      border-radius: 0 2px 2px 0;
      transition: background var(--transition);
    }
    .task-item.priority-high::before   { background: var(--danger); }
    .task-item.priority-medium::before { background: var(--warn); }
    .task-item.priority-low::before    { background: var(--info); }

    .task-item:hover {
      background: var(--bg-card-hover);
      transform: translateY(-2px);
      box-shadow: var(--shadow-drop);
      border-color: rgba(139,92,246,0.2);
    }
    .task-item:active { cursor: grabbing; }

    /* Drag states */
    .task-item.dragging {
      opacity: 0.4;
      transform: scale(0.97);
    }
    .task-item.drag-over {
      border-color: var(--accent);
      background: var(--accent-soft);
      transform: translateY(-3px);
    }

    /* Completed state */
    .task-item.completed {
      opacity: 0.6;
    }
    .task-item.completed .task-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    /* ─── CHECKBOX ───────────────────────────────────────── */
    .task-check {
      width: 22px; height: 22px; flex-shrink: 0;
      border-radius: 7px;
      border: 2px solid var(--border);
      background: transparent;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all var(--transition-bounce);
      margin-top: 1px;
    }
    .task-check:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
      transform: scale(1.1);
    }
    .task-check.checked {
      background: linear-gradient(135deg, var(--success), #34d399);
      border-color: var(--success);
      box-shadow: 0 2px 12px rgba(16,185,129,0.4);
      animation: checkPop var(--transition-bounce) forwards;
    }
    @keyframes checkPop {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.25) rotate(-5deg); }
      100% { transform: scale(1) rotate(0deg); }
    }
    .task-check .checkmark {
      opacity: 0;
      transform: scale(0);
      transition: all var(--transition-bounce);
      color: #fff;
      font-size: 13px;
    }
    .task-check.checked .checkmark { opacity: 1; transform: scale(1); }

    /* ─── TASK BODY ──────────────────────────────────────── */
    .task-body { flex: 1; min-width: 0; }

    .task-text {
      font-size: 0.92rem;
      font-weight: 500;
      line-height: 1.45;
      color: var(--text-primary);
      word-break: break-word;
      transition: color var(--transition);
      outline: none;
    }
    .task-text[contenteditable="true"] {
      border-bottom: 1.5px dashed var(--accent);
      padding-bottom: 2px;
    }

    .task-meta-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    /* Priority badge */
    .priority-badge {
      font-size: 0.68rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 99px;
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }
    .priority-badge.high   { background: var(--danger-soft); color: var(--danger); }
    .priority-badge.medium { background: var(--warn-soft);   color: var(--warn);   }
    .priority-badge.low    { background: var(--info-soft);   color: var(--info);   }
    .priority-badge.none   { display: none; }

    /* Due date badge */
    .due-badge {
      font-size: 0.68rem;
      font-weight: 500;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .due-badge.overdue { color: var(--danger); font-weight: 600; }
    .due-badge.today   { color: var(--warn);   font-weight: 600; }

    /* ─── TASK ACTIONS ───────────────────────────────────── */
    .task-actions {
      display: flex;
      gap: 4px;
      align-items: center;
      opacity: 0;
      transform: translateX(6px);
      transition: all var(--transition);
      flex-shrink: 0;
    }
    .task-item:hover .task-actions { opacity: 1; transform: translateX(0); }

    .icon-btn {
      width: 32px; height: 32px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      transition: all var(--transition);
    }
    .icon-btn:hover { transform: scale(1.1); }
    .icon-btn.edit-btn:hover  { color: var(--accent); background: var(--accent-soft); border-color: var(--accent-soft); }
    .icon-btn.delete-btn:hover { color: var(--danger); background: var(--danger-soft); border-color: var(--danger-soft); }
    .icon-btn.save-btn { color: var(--success); display: none; }
    .icon-btn.save-btn.visible { display: flex; }
    .icon-btn.save-btn:hover { background: var(--success-soft); border-color: var(--success-soft); }

    /* ─── ENTRY / EXIT ANIMATIONS ────────────────────────── */
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-12px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes slideOut {
      from { opacity: 1; transform: translateX(0) scale(1); max-height: 200px; margin-bottom: 10px; }
      to   { opacity: 0; transform: translateX(30px) scale(0.95); max-height: 0; margin-bottom: 0; padding: 0; }
    }

    .task-item.entering { animation: slideIn 0.35s var(--transition-bounce) forwards; }
    .task-item.leaving  { animation: slideOut 0.3s ease forwards; overflow: hidden; }

    /* ─── EMPTY STATE ────────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      display: none;
    }
    .empty-state.visible { display: block; }

    .empty-icon {
      font-size: 56px;
      margin-bottom: 16px;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }

    .empty-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .empty-sub {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    /* ─── TOAST NOTIFICATION ─────────────────────────────── */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      padding: 12px 18px;
      border-radius: var(--radius-md);
      background: var(--bg-card);
      border: 1px solid var(--border);
      backdrop-filter: blur(20px);
      box-shadow: var(--shadow-drop);
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
      animation: toastIn 0.35s var(--transition-bounce) forwards;
      max-width: 300px;
    }
    .toast.out { animation: toastOut 0.3s ease forwards; }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(20px) scale(0.9); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes toastOut {
      from { opacity: 1; transform: translateY(0) scale(1); }
      to   { opacity: 0; transform: translateY(10px) scale(0.92); }
    }

    .toast-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .toast.success .toast-dot { background: var(--success); box-shadow: 0 0 8px var(--success); }
    .toast.danger  .toast-dot { background: var(--danger);  box-shadow: 0 0 8px var(--danger);  }
    .toast.info    .toast-dot { background: var(--accent);  box-shadow: 0 0 8px var(--accent);  }

    /* ─── DRAG HANDLE ────────────────────────────────────── */
    .drag-handle {
      width: 20px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
      align-items: center;
      padding-top: 5px;
      opacity: 0;
      transition: opacity var(--transition);
      cursor: grab;
    }
    .task-item:hover .drag-handle { opacity: 0.4; }
    .drag-handle-dot {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    /* ─── FOOTER ─────────────────────────────────────────── */
    .app-footer {
      text-align: center;
      margin-top: 32px;
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.3px;
    }

    /* ─── RESPONSIVE ─────────────────────────────────────── */
    @media (max-width: 520px) {
      body { padding: 16px 12px 50px; }
      .stats-bar { gap: 8px; }
      .stat-pill { padding: 12px 10px; }
      .stat-number { font-size: 1.35rem; }
      .input-meta { flex-direction: column; }
      .filter-bar { gap: 5px; }
      .filter-btn { padding: 6px 12px; font-size: 0.75rem; }
      .brand-text h1 { font-size: 1.2rem; }
    }
  </style>
</head>

<body>
  <!-- ───────────────────────────────────────── APP ──── -->
  <div class="app-wrapper" id="app">

    <!-- Header -->
    <header class="app-header">
      <div class="app-brand">
        <div class="brand-icon">✦</div>
        <div class="brand-text">
          <h1>Tasky</h1>
          <p>Get things done, beautifully.</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="theme-toggle" id="themeToggle" title="Toggle theme" aria-label="Toggle light/dark theme">🌙</button>
      </div>
    </header>

    <!-- Stats Bar -->
    <div class="stats-bar" aria-label="Task statistics">
      <div class="stat-pill total">
        <span class="stat-number" id="statTotal">0</span>
        <span class="stat-label">Total</span>
      </div>
      <div class="stat-pill done">
        <span class="stat-number" id="statDone">0</span>
        <span class="stat-label">Done</span>
      </div>
      <div class="stat-pill pending">
        <span class="stat-number" id="statPending">0</span>
        <span class="stat-label">Pending</span>
      </div>
    </div>

    <!-- Progress -->
    <div class="progress-wrap" aria-label="Overall completion progress">
      <div class="progress-header">
        <span class="progress-title">Overall Progress</span>
        <span class="progress-percent" id="progressPercent">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>
    </div>

    <!-- Input Card -->
    <section class="input-card" aria-label="Add new task">
      <div class="input-row">
        <input
          type="text"
          class="task-input"
          id="taskInput"
          placeholder="What's on your mind? Press Enter to add…"
          aria-label="Task description"
          maxlength="250"
          autocomplete="off"
        />
        <button class="add-btn" id="addBtn" title="Add task" aria-label="Add task">+</button>
      </div>
      <div class="input-meta">
        <select class="meta-select" id="prioritySelect" aria-label="Priority level">
          <option value="none">📋 No Priority</option>
          <option value="high">🔴 High</option>
          <option value="medium">🟡 Medium</option>
          <option value="low">🔵 Low</option>
        </select>
        <input type="date" class="meta-date" id="dueDateInput" aria-label="Due date" />
      </div>
    </section>

    <!-- Filter + Action Row -->
    <div class="filter-bar" role="group" aria-label="Filter tasks">
      <button class="filter-btn active" data-filter="all"       aria-pressed="true">All</button>
      <button class="filter-btn"        data-filter="pending"   aria-pressed="false">Pending</button>
      <button class="filter-btn"        data-filter="completed" aria-pressed="false">Completed</button>
      <button class="filter-btn"        data-filter="high"      aria-pressed="false">🔴 High</button>
      <button class="filter-btn"        data-filter="medium"    aria-pressed="false">🟡 Medium</button>
      <button class="filter-btn"        data-filter="low"       aria-pressed="false">🔵 Low</button>
    </div>

    <div class="action-row">
      <select class="sort-select" id="sortSelect" aria-label="Sort tasks">
        <option value="newest">↓ Newest first</option>
        <option value="oldest">↑ Oldest first</option>
        <option value="priority">⚡ By priority</option>
        <option value="duedate">📅 By due date</option>
        <option value="alpha">🔤 Alphabetical</option>
      </select>
      <button class="clear-btn" id="clearDoneBtn" aria-label="Clear completed tasks">🗑 Clear done</button>
    </div>

    <!-- Task List -->
    <main>
      <ul class="task-list" id="taskList" aria-label="Task list" role="list"></ul>
      <div class="empty-state" id="emptyState" role="status" aria-live="polite">
        <div class="empty-icon">🎯</div>
        <div class="empty-title">All clear!</div>
        <p class="empty-sub">You have no tasks here.<br />Add something above to get started.</p>
      </div>
    </main>

    <footer class="app-footer">Made with ♥ · Tasky · <span id="currentYear"></span></footer>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="false"></div>

  <!-- ═══════════════════════════════════════════════════════════
       JAVASCRIPT
  ═══════════════════════════════════════════════════════════ -->
  <script>
    // ─── STATE ───────────────────────────────────────────────────
    let tasks       = [];
    let currentFilter = 'all';
    let currentSort   = 'newest';
    let dragSrcId     = null;

    const PRIORITY_ORDER = { high: 0, medium: 1, low: 2, none: 3 };

    // ─── DOM REFS ─────────────────────────────────────────────────
    const taskInput     = document.getElementById('taskInput');
    const addBtn        = document.getElementById('addBtn');
    const taskList      = document.getElementById('taskList');
    const emptyState    = document.getElementById('emptyState');
    const statTotal     = document.getElementById('statTotal');
    const statDone      = document.getElementById('statDone');
    const statPending   = document.getElementById('statPending');
    const progressFill  = document.getElementById('progressFill');
    const progressPct   = document.getElementById('progressPercent');
    const themeToggle   = document.getElementById('themeToggle');
    const prioritySel   = document.getElementById('prioritySelect');
    const dueDateInput  = document.getElementById('dueDateInput');
    const sortSelect    = document.getElementById('sortSelect');
    const clearDoneBtn  = document.getElementById('clearDoneBtn');
    const filterBtns    = document.querySelectorAll('.filter-btn');
    const toastContainer = document.getElementById('toastContainer');

    // ─── UTILITIES ────────────────────────────────────────────────
    const uid = () => `t_${Date.now()}_${Math.random().toString(36).slice(2,7)}`;
    const save = () => localStorage.setItem('tasky_tasks', JSON.stringify(tasks));
    const load = () => {
      try { tasks = JSON.parse(localStorage.getItem('tasky_tasks')) || []; }
      catch { tasks = []; }
    };

    function formatDate(str) {
      if (!str) return '';
      const d = new Date(str + 'T00:00:00');
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }

    function dueDateStatus(str) {
      if (!str) return '';
      const today = new Date(); today.setHours(0,0,0,0);
      const due   = new Date(str + 'T00:00:00');
      if (due < today) return 'overdue';
      if (due.getTime() === today.getTime()) return 'today';
      return '';
    }

    // ─── TOAST ───────────────────────────────────────────────────
    function showToast(msg, type = 'info') {
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      t.innerHTML = `<span class="toast-dot"></span>${msg}`;
      toastContainer.appendChild(t);
      setTimeout(() => {
        t.classList.add('out');
        t.addEventListener('animationend', () => t.remove());
      }, 2800);
    }

    // ─── ADD TASK ─────────────────────────────────────────────────
    function addTask() {
      const text = taskInput.value.trim();
      if (!text) { taskInput.focus(); taskInput.classList.add('shake'); setTimeout(() => taskInput.classList.remove('shake'), 400); return; }

      const task = {
        id: uid(),
        text,
        completed: false,
        priority: prioritySel.value,
        dueDate: dueDateInput.value,
        createdAt: Date.now()
      };
      tasks.unshift(task);
      save();

      taskInput.value = '';
      prioritySel.value = 'none';
      dueDateInput.value = '';
      taskInput.focus();

      renderTasks();
      showToast('Task added!', 'success');
    }

    // ─── DELETE TASK ──────────────────────────────────────────────
    function deleteTask(id) {
      const el = document.querySelector(`[data-id="${id}"]`);
      if (!el) return;
      el.classList.add('leaving');
      el.addEventListener('animationend', () => {
        tasks = tasks.filter(t => t.id !== id);
        save();
        renderTasks();
        showToast('Task removed.', 'danger');
      }, { once: true });
    }

    // ─── TOGGLE COMPLETE ─────────────────────────────────────────
    function toggleTask(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      task.completed = !task.completed;
      save();
      renderTasks();
      showToast(task.completed ? '✅ Marked as done!' : 'Marked as pending.', task.completed ? 'success' : 'info');
    }

    // ─── EDIT TASK ────────────────────────────────────────────────
    function startEdit(id) {
      const el    = document.querySelector(`[data-id="${id}"]`);
      const span  = el.querySelector('.task-text');
      const saveB = el.querySelector('.save-btn');
      const editB = el.querySelector('.edit-btn');

      span.contentEditable = 'true';
      span.focus();
      // Move cursor to end
      const range = document.createRange();
      const sel   = window.getSelection();
      range.selectNodeContents(span);
      range.collapse(false);
      sel.removeAllRanges();
      sel.addRange(range);

      saveB.classList.add('visible');
      editB.style.display = 'none';

      span.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); saveEdit(id); }
        if (e.key === 'Escape') { cancelEdit(id); }
      });
    }

    function saveEdit(id) {
      const el   = document.querySelector(`[data-id="${id}"]`);
      const span = el.querySelector('.task-text');
      const newText = span.textContent.trim();
      if (!newText) { span.textContent = tasks.find(t => t.id === id)?.text || ''; }
      else { const task = tasks.find(t => t.id === id); if (task) task.text = newText; }
      span.contentEditable = 'false';
      el.querySelector('.save-btn').classList.remove('visible');
      el.querySelector('.edit-btn').style.display = '';
      save();
      showToast('Task updated.', 'info');
    }

    function cancelEdit(id) {
      const el   = document.querySelector(`[data-id="${id}"]`);
      const span = el.querySelector('.task-text');
      span.textContent = tasks.find(t => t.id === id)?.text || '';
      span.contentEditable = 'false';
      el.querySelector('.save-btn').classList.remove('visible');
      el.querySelector('.edit-btn').style.display = '';
    }

    // ─── FILTER & SORT ────────────────────────────────────────────
    function getFilteredSorted() {
      let list = [...tasks];

      // Filter
      if (currentFilter === 'completed') list = list.filter(t => t.completed);
      else if (currentFilter === 'pending') list = list.filter(t => !t.completed);
      else if (['high','medium','low'].includes(currentFilter))
        list = list.filter(t => t.priority === currentFilter);

      // Sort
      if (currentSort === 'newest')  list.sort((a,b) => b.createdAt - a.createdAt);
      if (currentSort === 'oldest')  list.sort((a,b) => a.createdAt - b.createdAt);
      if (currentSort === 'priority') list.sort((a,b) => (PRIORITY_ORDER[a.priority]||3) - (PRIORITY_ORDER[b.priority]||3));
      if (currentSort === 'alpha')   list.sort((a,b) => a.text.localeCompare(b.text));
      if (currentSort === 'duedate') list.sort((a,b) => {
        if (!a.dueDate && !b.dueDate) return 0;
        if (!a.dueDate) return 1;
        if (!b.dueDate) return -1;
        return a.dueDate.localeCompare(b.dueDate);
      });

      return list;
    }

    // ─── BUILD TASK ELEMENT ───────────────────────────────────────
    function buildTaskEl(task) {
      const li = document.createElement('li');
      li.className = `task-item priority-${task.priority} ${task.completed ? 'completed' : ''} entering`;
      li.setAttribute('data-id', task.id);
      li.setAttribute('draggable', 'true');
      li.setAttribute('role', 'listitem');

      const status = dueDateStatus(task.dueDate);
      const dueLbl = task.dueDate
        ? `<span class="due-badge ${status}" title="${status === 'overdue' ? 'Overdue!' : status === 'today' ? 'Due today!' : ''}">
            ${status === 'overdue' ? '⚠' : '📅'} ${formatDate(task.dueDate)}
           </span>`
        : '';

      const priorityLbl = task.priority !== 'none'
        ? `<span class="priority-badge ${task.priority}">${task.priority}</span>`
        : '';

      li.innerHTML = `
        <div class="drag-handle" aria-hidden="true">
          <div class="drag-handle-dot"></div>
          <div class="drag-handle-dot"></div>
          <div class="drag-handle-dot"></div>
          <div class="drag-handle-dot"></div>
          <div class="drag-handle-dot"></div>
          <div class="drag-handle-dot"></div>
        </div>
        <button class="task-check ${task.completed ? 'checked' : ''}"
                aria-label="${task.completed ? 'Mark as pending' : 'Mark as done'}"
                aria-checked="${task.completed}">
          <span class="checkmark">✓</span>
        </button>
        <div class="task-body">
          <span class="task-text" role="textbox" aria-label="Task text">${escapeHtml(task.text)}</span>
          <div class="task-meta-row">
            ${priorityLbl}
            ${dueLbl}
          </div>
        </div>
        <div class="task-actions">
          <button class="icon-btn edit-btn" title="Edit task" aria-label="Edit task">✏️</button>
          <button class="icon-btn save-btn" title="Save task" aria-label="Save task">💾</button>
          <button class="icon-btn delete-btn" title="Delete task" aria-label="Delete task">🗑️</button>
        </div>`;

      // Events
      li.querySelector('.task-check').addEventListener('click',  () => toggleTask(task.id));
      li.querySelector('.edit-btn').addEventListener('click',    () => startEdit(task.id));
      li.querySelector('.save-btn').addEventListener('click',    () => saveEdit(task.id));
      li.querySelector('.delete-btn').addEventListener('click',  () => deleteTask(task.id));

      // Drag & Drop
      li.addEventListener('dragstart', (e) => {
        dragSrcId = task.id;
        li.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      li.addEventListener('dragend', () => {
        dragSrcId = null;
        li.classList.remove('dragging');
        document.querySelectorAll('.task-item').forEach(el => el.classList.remove('drag-over'));
      });
      li.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        document.querySelectorAll('.task-item').forEach(el => el.classList.remove('drag-over'));
        if (dragSrcId !== task.id) li.classList.add('drag-over');
      });
      li.addEventListener('drop', (e) => {
        e.preventDefault();
        if (!dragSrcId || dragSrcId === task.id) return;
        const srcIdx  = tasks.findIndex(t => t.id === dragSrcId);
        const destIdx = tasks.findIndex(t => t.id === task.id);
        const [moved] = tasks.splice(srcIdx, 1);
        tasks.splice(destIdx, 0, moved);
        save();
        renderTasks();
        li.classList.remove('drag-over');
      });

      return li;
    }

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ─── RENDER ───────────────────────────────────────────────────
    function renderTasks() {
      taskList.innerHTML = '';
      const list = getFilteredSorted();

      if (list.length === 0) {
        emptyState.classList.add('visible');
      } else {
        emptyState.classList.remove('visible');
        list.forEach(task => taskList.appendChild(buildTaskEl(task)));
      }

      updateStats();
      updateClearBtn();
    }

    function updateStats() {
      const total   = tasks.length;
      const done    = tasks.filter(t => t.completed).length;
      const pending = total - done;
      const pct     = total === 0 ? 0 : Math.round((done / total) * 100);

      statTotal.textContent   = total;
      statDone.textContent    = done;
      statPending.textContent = pending;
      progressFill.style.width = pct + '%';
      progressPct.textContent  = pct + '%';
    }

    function updateClearBtn() {
      const hasDone = tasks.some(t => t.completed);
      clearDoneBtn.classList.toggle('visible', hasDone);
    }

    // ─── CLEAR DONE ───────────────────────────────────────────────
    function clearCompleted() {
      tasks = tasks.filter(t => !t.completed);
      save();
      renderTasks();
      showToast('Cleared completed tasks.', 'info');
    }

    // ─── THEME ───────────────────────────────────────────────────
    function initTheme() {
      const saved = localStorage.getItem('tasky_theme');
      const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      applyTheme(theme);
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
      localStorage.setItem('tasky_theme', theme);
    }

    function toggleTheme() {
      const cur = document.documentElement.getAttribute('data-theme');
      applyTheme(cur === 'dark' ? 'light' : 'dark');
    }

    // ─── KEYBOARD SHAKE ANIMATION ─────────────────────────────────
    const shakeStyle = document.createElement('style');
    shakeStyle.textContent = `
      @keyframes shake {
        0%,100%{ transform:translateX(0); }
        20%    { transform:translateX(-6px); }
        40%    { transform:translateX(6px); }
        60%    { transform:translateX(-4px); }
        80%    { transform:translateX(4px); }
      }
      .shake { animation: shake 0.35s ease; border-color: var(--danger) !important; box-shadow: 0 0 0 3px var(--danger-soft) !important; }
    `;
    document.head.appendChild(shakeStyle);

    // ─── EVENT LISTENERS ─────────────────────────────────────────
    addBtn.addEventListener('click', addTask);
    taskInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addTask(); });
    themeToggle.addEventListener('click', toggleTheme);
    sortSelect.addEventListener('change', () => { currentSort = sortSelect.value; renderTasks(); });
    clearDoneBtn.addEventListener('click', clearCompleted);

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => { b.classList.remove('active'); b.setAttribute('aria-pressed', 'false'); });
        btn.classList.add('active');
        btn.setAttribute('aria-pressed', 'true');
        currentFilter = btn.dataset.filter;
        renderTasks();
      });
    });

    // ─── INIT ────────────────────────────────────────────────────
    document.getElementById('currentYear').textContent = new Date().getFullYear();
    initTheme();
    load();
    renderTasks();
  </script>
</body>
</html>
